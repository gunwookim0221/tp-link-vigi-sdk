name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and validate release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel --outdir dist

      - name: Validate artifact contents and metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as tar_open
          from zipfile import ZipFile

          dist = Path("dist")
          artifacts = {path.name for path in dist.iterdir() if path.is_file()}
          expected = {
              "tp_link_vigi_sdk-0.3.0-py3-none-any.whl",
              "tp_link_vigi_sdk-0.3.0.tar.gz",
          }
          if artifacts != expected:
              raise SystemExit(f"Unexpected release artifacts: {sorted(artifacts)}")

          forbidden_fragments = (".env", ".pypirc", ".pdf", "credentials", "password")

          wheel = dist / "tp_link_vigi_sdk-0.3.0-py3-none-any.whl"
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode("utf-8")
              if "Version: 0.3.0" not in metadata.splitlines():
                  raise SystemExit("Wheel metadata version is not 0.3.0")
              required = {"vigi/__init__.py", "vigi/client.py", "vigi/ptz.py", "vigi/audio.py", "vigi/alarm.py"}
              if not required.issubset(names):
                  raise SystemExit("Wheel is missing expected public SDK modules")
              if any(any(fragment in name.lower() for fragment in forbidden_fragments) for name in names):
                  raise SystemExit("Wheel contains a forbidden private/vendor file")

          sdist = dist / "tp_link_vigi_sdk-0.3.0.tar.gz"
          with tar_open(sdist) as archive:
              names = set(archive.getnames())
              metadata_name = next(name for name in names if name.endswith("/PKG-INFO"))
              metadata = archive.extractfile(metadata_name).read().decode("utf-8")
              if "Version: 0.3.0" not in metadata.splitlines():
                  raise SystemExit("Source distribution metadata version is not 0.3.0")
              if not any(name.endswith("/src/vigi/__init__.py") for name in names):
                  raise SystemExit("Source distribution is missing the SDK package")
              if any(any(fragment in name.lower() for fragment in forbidden_fragments) for name in names):
                  raise SystemExit("Source distribution contains a forbidden private/vendor file")
          PY

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
